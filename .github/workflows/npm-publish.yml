name: Publish NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.14.0)'
        required: true

jobs:
  publish:
    name: Publish @indoulia/ferret
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): GitHub mints a short-lived id-token that npm
    # exchanges for publish rights. No stored NPM_TOKEN. Requires the package's
    # trusted-publisher entry to be configured on npmjs.com (repo + this
    # workflow file). See docs/012-Releases/RELEASE-PROCESS.md.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node >= 24.7.0 bundles npm >= 11.5.1 (Trusted Publishing's minimum)
          # already, so no self-upgrade step is needed. `npm install -g npm@X`
          # to self-upgrade is avoided deliberately: it overwrites the very
          # npm process running it, which reproducibly broke here with
          # MODULE_NOT_FOUND: 'promise-retry' inside npm's own dependency
          # tree, regardless of target version (12.0.1 and 11.18.0 both hit
          # it -- see the v2.0.0 release history for the two failed attempts).
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify bundled npm satisfies Trusted Publishing's minimum
        run: |
          v="$(npm --version)"
          echo "Bundled npm: $v"
          node -e "
            const [maj, min] = '$v'.split('.').map(Number);
            if (maj < 11 || (maj === 11 && min < 5)) {
              console.error('Bundled npm ' + '$v' + ' is below the >= 11.5.1 Trusted Publishing requirement.');
              process.exit(1);
            }
          "

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"

      - name: Set package version
        working-directory: Ferret.Npm
        run: npm version "${{ steps.v.outputs.VERSION }}" --no-git-tag-version --allow-same-version

      - name: Install (no scripts)
        working-directory: Ferret.Npm
        run: npm ci --ignore-scripts

      - name: Test
        working-directory: Ferret.Npm
        run: npm test

      - name: Publish (Trusted Publishing via OIDC; provenance automatic)
        working-directory: Ferret.Npm
        run: npm publish --access public
