name: Publish NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.14.0)'
        required: true

jobs:
  publish:
    name: Publish @indoulia/ferret
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): GitHub mints a short-lived id-token that npm
    # exchanges for publish rights. No stored NPM_TOKEN. Requires the package's
    # trusted-publisher entry to be configured on npmjs.com (repo + this
    # workflow file). See docs/012-Releases/RELEASE-PROCESS.md.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"

      - name: Set package version
        working-directory: Ferret.Npm
        run: npm version "${{ steps.v.outputs.VERSION }}" --no-git-tag-version --allow-same-version

      - name: Install (no scripts)
        working-directory: Ferret.Npm
        run: npm ci --ignore-scripts

      - name: Test
        working-directory: Ferret.Npm
        run: npm test

      - name: Publish (Trusted Publishing via OIDC; provenance automatic)
        working-directory: Ferret.Npm
        run: npm publish --access public
