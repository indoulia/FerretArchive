name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # Split into a numeric prefix (major.minor.patch) and an optional
          # prerelease suffix. VersionPrefix must be numeric — FileVersion is
          # derived from it and rejects a prerelease label (CS7034/CS7035).
          PREFIX="${VERSION%%-*}"
          case "$VERSION" in
            *-*) SUFFIX="${VERSION#*-}" ;;
            *)   SUFFIX="" ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION_PREFIX=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "VERSION_SUFFIX=$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/Ferret.sln

      - name: Build
        run: >
          dotnet build src/Ferret.sln
          --no-restore
          --configuration Release
          /p:VersionPrefix=${{ steps.version.outputs.VERSION_PREFIX }}
          /p:VersionSuffix=${{ steps.version.outputs.VERSION_SUFFIX }}

      - name: Test
        run: dotnet test src/Ferret.sln --no-build --configuration Release

      - name: Pack
        run: >
          dotnet pack src/Ferret.sln
          --no-build
          --configuration Release
          /p:VersionPrefix=${{ steps.version.outputs.VERSION_PREFIX }}
          /p:VersionSuffix=${{ steps.version.outputs.VERSION_SUFFIX }}
          --output ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Ferret v${{ steps.version.outputs.VERSION }}
          draft: true
          generate_release_notes: true
          files: ./artifacts/*.nupkg
