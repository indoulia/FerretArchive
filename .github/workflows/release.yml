name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # Split into a numeric prefix (major.minor.patch) and an optional
          # prerelease suffix. VersionPrefix must be numeric — FileVersion is
          # derived from it and rejects a prerelease label (CS7034/CS7035).
          PREFIX="${VERSION%%-*}"
          case "$VERSION" in
            *-*) SUFFIX="${VERSION#*-}" ;;
            *)   SUFFIX="" ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION_PREFIX=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "VERSION_SUFFIX=$SUFFIX" >> "$GITHUB_OUTPUT"
          # Capture the release date once and pass it explicitly to the manifest
          # generator so the generated manifest is deterministic for this run.
          echo "DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/Ferret.sln

      - name: Build
        run: >
          dotnet build src/Ferret.sln
          --no-restore
          --configuration Release
          /p:VersionPrefix=${{ steps.version.outputs.VERSION_PREFIX }}
          /p:VersionSuffix=${{ steps.version.outputs.VERSION_SUFFIX }}

      - name: Test
        run: dotnet test src/Ferret.sln --no-build --configuration Release

      - name: Pack
        run: >
          dotnet pack src/Ferret.sln
          --no-build
          --configuration Release
          /p:VersionPrefix=${{ steps.version.outputs.VERSION_PREFIX }}
          /p:VersionSuffix=${{ steps.version.outputs.VERSION_SUFFIX }}
          --output ./artifacts

      - name: Build distribution packages (all RIDs)
        shell: pwsh
        run: |
          $rids = @('win-x64','linux-x64','osx-arm64','osx-x64')
          foreach ($rid in $rids) {
            ./package.ps1 -Version '${{ steps.version.outputs.VERSION }}' -Rid $rid
          }

      - name: Build release manifest
        shell: pwsh
        run: |
          ./scripts/build-release-manifest.ps1 `
            -Version '${{ steps.version.outputs.VERSION }}' `
            -ArtifactsDir './artifacts' `
            -Published '${{ steps.version.outputs.DATE }}'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Ferret v${{ steps.version.outputs.VERSION }}
          draft: true
          generate_release_notes: true
          files: |
            ./artifacts/*.nupkg
            ./artifacts/Ferret-*.zip
            ./artifacts/SHA256SUMS.txt
            ./artifacts/release-manifest.json

      # Publish the downloadable payload to the PUBLIC distribution mirror. The
      # source repo may be private; anonymous `npm install` can only fetch release
      # assets from a public repo, so the installer downloads from here (see
      # Ferret.Npm/lib/distribution-config.js). Published (non-draft) so the
      # assets are immediately reachable. Requires DIST_REPO_TOKEN — a token with
      # contents:write on indoulia/ferret-dist (the default GITHUB_TOKEN is scoped
      # to this repo only). See docs/012-Releases/RELEASE-PROCESS.md.
      - name: Publish download assets to public distribution mirror
        uses: softprops/action-gh-release@v2
        with:
          repository: indoulia/ferret-dist
          token: ${{ secrets.DIST_REPO_TOKEN }}
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Ferret v${{ steps.version.outputs.VERSION }}
          draft: false
          body: >
            Download assets for Ferret v${{ steps.version.outputs.VERSION }}.
            Source and release notes live in the main repository.
          files: |
            ./artifacts/Ferret-*.zip
            ./artifacts/SHA256SUMS.txt
            ./artifacts/release-manifest.json

      # Guard against the exact failure this mirror exists to prevent: an
      # unauthenticated fetch of the manifest must return 200. If the mirror is
      # private or the publish step was skipped, this fails the release instead
      # of shipping an npm package that 404s on install.
      - name: Verify manifest is anonymously reachable
        working-directory: Ferret.Npm
        run: node scripts/verify-download-endpoint.js v${{ steps.version.outputs.VERSION }}
