name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

# NOTE: CodeQL Analysis and Dependency Review were removed because they require
# GitHub Advanced Security on a private repo (code scanning + dependency graph
# APIs return 403 on the free plan). To restore them, make the repo public or
# enable Advanced Security, then re-add the `codeql` and `dependency-review`
# jobs and `security-events: write` / `actions: read` permissions.

permissions:
  contents: read

jobs:
  nuget-audit:
    name: NuGet Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore src/Ferret.sln
      - run: dotnet list src/Ferret.sln package --vulnerable --include-transitive
